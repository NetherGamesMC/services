name: Publish package to the Maven Repository
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  publish:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '17'
      - name: Purge cache
        if: "contains(github.event.head_commit.message, '[Prune]')"
        run: "rm -rf ~/.m2"
      - name: Set up Maven
        uses: stCarolas/setup-maven@v4.5
        with:
          maven-version: 3.8.2
      - name: Publish client
        run: mvn -T 4 --batch-mode deploy package install -q -s settings.xml
        env:
          REPO_USERNAME: github-deploy
          REPO_PASSWORD: ${{ secrets.DEPLOY_TOKEN }}