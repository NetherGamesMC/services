syntax = "proto3";
option java_multiple_files = true;
package org.nethergames.gsms.rpc;
option go_package = "github.com/NetherGamesMC/GSMS/go-grpc;gsms";


option php_metadata_namespace = "nethergames\\gsms\\rpc\\metadata";
option php_namespace = "nethergames\\gsms\\rpc";

enum ServerEventType {
  SERVER_ADD = 0;
  SERVER_UPDATE = 1;
  SERVER_REMOVE = 2;
  SERVER_LOBBY_UPDATE = 3;
}

enum ServerStatus {
  STATUS_TERMINATING = 0;
  STATUS_ONLINE = 1;
}

enum Region {
  EU = 0;
  US = 1;
  AP = 2;
  IND = 3;
}

message ProxyModel {
  Region region = 1;
  string proxyId = 2; // The proxy id should be generated by the client
  int32 playerCount = 3;
}

message ServerEvent {
  ServerEventType eventType = 1;
  ServerModel server = 2;
}

message GameEvent {
  string gameType = 1;
  string serverType = 2;
  int32 maxPlayers = 3;
  int32 totalPlayers = 4;

  repeated GameServerStatus clusterData = 5;
}

message GameServerStatus {
  string serverUniqueId = 1;
  int32 maxPlayers = 2;
  int32 totalPlayers = 3;
}

message ServerModel {
  Region region = 1;
  ServerStatus status = 2;
  string serverUniqueId = 3;
  string serverType = 4;
  string gameType = 5;
  string address = 6;
  int32 port = 7;
  int32 playerCount = 8;
  int32 maxPlayerCount = 9;
  bool queueingState = 10;
  bool touchOnlyState = 11;
  float lastTps = 12;
  float lastUsage = 13;
  float lastMemoryUsage = 14;
  string proxyServerInfoType = 15;
}

message RequestIdentifier {
  string identifier = 1;
}

message UpdateModel {
  string serverUniqueId = 1;
  StatusBody status = 2;
}

message StatusBody {
  string serverUniqueId = 1;
  int32 playerCount = 2;
  int32 maxPlayerCount = 3;
  bool queueingState = 4;
  bool touchOnlyState = 5;
  ServerStatus status = 6;
  float tps = 7;
  float usage = 8;
  float memoryUsage = 9;
  string proxyServerInfoType = 10;
}

service GSMSService {
  // For downstream servers to listen on changes, as well as providing server status in real-time.
  rpc registerListenerGame(stream UpdateModel) returns (stream GameEvent);

  // Register proxy listener to listen on changes, and provide proxy status in real-time.
  rpc registerListenerProxy(stream ProxyModel) returns (stream ServerEvent);
}