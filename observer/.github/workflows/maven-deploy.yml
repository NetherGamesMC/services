name: Publish package to the Maven Repository
on: push
jobs:
  publish:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: 'adopt'
          java-version: '17'
      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.8.2
      - name: Publish client
        if: github.ref == 'refs/heads/latest'
        run: mvn -T 4 --batch-mode install deploy -q -s settings.xml
        env:
          REPO_USERNAME: github-deploy
          REPO_PASSWORD: ${{ secrets.DEPLOY_TOKEN }}
      - name: "Build server"
        run: mvn -T 4 install
      - name: Login to DockerHub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.docker_username }}
          password: ${{ secrets.docker_password }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          file: ./Dockerfile
          tags: "nethergamesmc/observer:${{github.ref_name}}"