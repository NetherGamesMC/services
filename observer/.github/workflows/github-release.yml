name: Observer Release
on:
  push:
    tags:
      - 'v*'
jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Startup
        uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v5.6.0
        with:
          java-version: 17
          distribution: adopt
      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.8.2
      - name: Build Observer
        run: mvn -B install -q --file pom.xml
      - name: Create Release
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: false
          title: "Observer ${{ github.ref_name }}"
          files: |
            server/target/Observer.jar
            data/target/Observer-Data.jar
            client/target/Observer-Client.jar