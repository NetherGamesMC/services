name: Golang gRPC Bindings
on:
  push:
    branches:
      - 'latest'
      - 'develop'
jobs:
  go-grpc-bindings:
    runs-on: ubuntu-latest
    if: "contains(github.event.head_commit.message, '[rpc build]')"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '^1.22.3'
      - name: Install Protoc
        uses: arduino/setup-protoc@v3

      - run: rm -rf grpc-go/social
      - run: mkdir grpc-go/social
      - name: install protoc-go
        run: go install github.com/golang/protobuf/protoc-gen-go@latest
      - name: install protoc-go-plugin
        run: go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Rebuild Matchmaking and Server API
        run: |
          protoc --go_out=grpc-go/social/ --go_opt=paths=source_relative \
          --go-grpc_out=grpc-go/social/ --go-grpc_opt=paths=source_relative \
          --proto_path ./rpc/src/main/proto social.proto locater.proto
      - name: Push changes to github
        run: |
          git add grpc-go/*
          git config --global user.name 'NetherGames Automation'
          git config --global user.email 'tobiasgrether@users.noreply.github.com'
          git commit -am "Automated GRPC regeneration"
          git push