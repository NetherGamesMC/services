name: Project deployment

on: ["repository_dispatch", "workflow_dispatch"]

jobs:
  publish:
    runs-on: self-hosted
    steps:
      - name: Setup Maven Action
        uses: s4u/setup-maven-action@v1.18.0
        with:
          java-version: '17'
          java-distribution: 'adopt'
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
      - name: Publish client
        run: mvn -T 4 --batch-mode deploy -q -s settings.xml
        env:
          REPO_USERNAME: github-deploy
          REPO_PASSWORD: ${{ secrets.DEPLOY_TOKEN }}
      - name: Build SocialService
        if: "contains(github.event.head_commit.message, '[Build]')"
        run: mvn --batch-mode clean install -q -s settings.xml
        env:
          REPO_USERNAME: github-deploy
          REPO_PASSWORD: ${{ secrets.DEPLOY_TOKEN }}
      - name: Login to DockerHub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.docker_username }}
          password: ${{ secrets.docker_password }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./server
          push: true
          file: ./server/Dockerfile
          tags: "nethergamesmc/social:${{github.ref_name}}"